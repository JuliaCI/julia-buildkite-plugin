# The cache contract: `XDG_CACHE_HOME` selects the cache directory, and an inherited
# `JULIA_DEPOT_PATH` is kept after the plugin's depot. `cache_dir: ""` overrides the
# `BUILDKITE_PLUGIN_JULIA_CACHE_DIR` that some runners still export.
self_test_setup: &self_test_setup
  post-checkout: |
    mkdir -p .buildkite/plugins/julia
    cp -Ra hooks plugin.yml README.md .buildkite/plugins/julia/

steps:
  - label: ":julia: cache contract (${AGENT_OS?})"
    agents:
      queue: "test"
      os: "${AGENT_OS?}"
      arch: "x86_64"
    env:
      XDG_CACHE_HOME: "/tmp/jbp-contract"
      JULIA_DEPOT_PATH: "/tmp/jbp-store"
    plugins:
      - staticfloat/metahook#sf/windows_backslashes:
          <<: *self_test_setup
      - "./.buildkite/plugins/julia":
          version: "1"
          cache_dir: ""
          update_registry: false
          artifacts_size_limit: "1"
          debug_plugin: "true"
    commands: |
      set -x
      CACHE="/tmp/jbp-contract/julia-buildkite-plugin"
      [[ "$${JULIA_DEPOT_PATH}" == "$${CACHE}/depots/$${BUILDKITE_PIPELINE_ID}:/tmp/jbp-store:" ]]
      [[ "$$(command -v julia)" == "$${CACHE}/installs/"* ]]
      [[ -f "$$(dirname "$$(command -v julia)")/../.julia-buildkite-plugin-complete" ]]
      julia -e 'DEPOT_PATH[2] == "/tmp/jbp-store" || error(DEPOT_PATH)'
      julia -e 'any(d -> isdir(joinpath(d, "stdlib")) || isdir(joinpath(d, "base")), DEPOT_PATH[3:end]) || error(DEPOT_PATH)'
